name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Imágenes de ESTA corrida (TP7: build once, deploy many).
# Son exactamente las mismas que publican build-backend y build-frontend (mismo nombre, mismo
# tag sha-<commit>, todo en minúsculas porque ghcr.io rechaza mayúsculas). Se definen UNA sola
# vez acá arriba y las leen deploy-qa y deploy-prod: como ambos jobs son de la misma corrida,
# github.sha vale lo mismo en los dos y PROD recibe la imagen que ya se verificó en QA.
# No existe el tag latest: un tag que se mueve no dice qué código está corriendo.
env:
  IMG_API: ghcr.io/cotykazuf/ingsoft3-tp01-backend:sha-${{ github.sha }}
  IMG_FRONT: ghcr.io/cotykazuf/ingsoft3-tp01-frontend:sha-${{ github.sha }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # Mínimo privilegio, declarado POR JOB (no arriba de todo): leer el código
    # y escribir paquetes en ghcr.io con el GITHUB_TOKEN de la corrida (sin tokens personales).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # --- Tests y coverage (TP5) ---
      # La receta vive en el Dockerfile (etapa "test"); acá solo se la invoca.
      - name: Construir la imagen de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend:test
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # Si los tests fallan o el coverage no llega al umbral, el comando del contenedor
      # termina con error y ESTE paso falla: el job queda rojo y el merge bloqueado.
      - name: Ejecutar tests y coverage del backend
        id: tests
        run: docker run --name backend-tests backend:test

      # Los tres pasos siguientes corren aunque los tests hayan fallado (if: always()),
      # para poder diagnosticar. No cambian el resultado: el job ya quedó en rojo por el paso anterior.
      - name: Sacar el reporte de coverage del contenedor
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          mkdir -p reports
          docker cp backend-tests:/app/coverage reports/backend

      - name: Resumen de coverage del backend
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          {
            echo "### Coverage del backend"
            echo ""
            echo "Resultado de los tests y del umbral: **${{ steps.tests.outcome }}**"
            echo ""
            if [ -f reports/backend/coverage-summary.json ]; then
              echo "| Métrica | Cobertura | Cubiertas / Totales |"
              echo "|---|---|---|"
              jq -r '.total | "| Líneas | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |", "| Ramas | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |", "| Funciones | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |"' reports/backend/coverage-summary.json
              echo ""
              echo "El umbral exigido está en backend/vitest.config.mjs. El reporte navegable se descarga del artifact **coverage-backend**."
            else
              echo "No se generó el reporte de coverage."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de coverage del backend (artifact)
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: reports/backend
          retention-days: 30
          if-no-files-found: warn

      # --- Publicación de la imagen (TP6) ---
      # Estos dos pasos son los ÚLTIMOS del job y NO llevan always() / !cancelled() /
      # continue-on-error: si algún paso anterior (tests, coverage) falló, el job se corta
      # y nunca se llega acá. La condición no está escrita: está en el orden.
      # Solo se entra al registry en un push (en un Pull Request este paso sale salteado).
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se construye siempre (en el PR también, para verificar que la imagen compila),
      # pero solo se publica cuando el evento es un push a main.
      # El nombre va en minúsculas escrito a mano: github.repository trae "CotyKazuf"
      # (con mayúsculas) y ghcr.io rechaza nombres con mayúsculas.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/cotykazuf/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # Mínimo privilegio, declarado POR JOB (no arriba de todo): leer el código
    # y escribir paquetes en ghcr.io con el GITHUB_TOKEN de la corrida (sin tokens personales).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # --- Tests y coverage (TP5) ---
      # La receta vive en el Dockerfile (etapa "test"); acá solo se la invoca.
      - name: Construir la imagen de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend:test
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      # Si los tests fallan o el coverage no llega al umbral, el comando del contenedor
      # termina con error y ESTE paso falla: el job queda rojo y el merge bloqueado.
      - name: Ejecutar tests y coverage del frontend
        id: tests
        run: docker run --name frontend-tests frontend:test

      # Los tres pasos siguientes corren aunque los tests hayan fallado (if: always()),
      # para poder diagnosticar. No cambian el resultado: el job ya quedó en rojo por el paso anterior.
      - name: Sacar el reporte de coverage del contenedor
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          mkdir -p reports
          docker cp frontend-tests:/app/coverage reports/frontend

      - name: Resumen de coverage del frontend
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          {
            echo "### Coverage del frontend"
            echo ""
            echo "Resultado de los tests y del umbral: **${{ steps.tests.outcome }}**"
            echo ""
            if [ -f reports/frontend/coverage-summary.json ]; then
              echo "| Métrica | Cobertura | Cubiertas / Totales |"
              echo "|---|---|---|"
              jq -r '.total | "| Líneas | \(.lines.pct)% | \(.lines.covered) / \(.lines.total) |", "| Ramas | \(.branches.pct)% | \(.branches.covered) / \(.branches.total) |", "| Funciones | \(.functions.pct)% | \(.functions.covered) / \(.functions.total) |"' reports/frontend/coverage-summary.json
              echo ""
              echo "El umbral exigido está en frontend/vitest.config.js. El reporte navegable se descarga del artifact **coverage-frontend**."
            else
              echo "No se generó el reporte de coverage."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de coverage del frontend (artifact)
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: reports/frontend
          retention-days: 30
          if-no-files-found: warn

      # --- Publicación de la imagen (TP6) ---
      # Estos dos pasos son los ÚLTIMOS del job y NO llevan always() / !cancelled() /
      # continue-on-error: si algún paso anterior (tests, coverage) falló, el job se corta
      # y nunca se llega acá. La condición no está escrita: está en el orden.
      # Solo se entra al registry en un push (en un Pull Request este paso sale salteado).
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se construye siempre (en el PR también, para verificar que la imagen compila),
      # pero solo se publica cuando el evento es un push a main.
      # El nombre va en minúsculas escrito a mano: github.repository trae "CotyKazuf"
      # (con mayúsculas) y ghcr.io rechaza nombres con mayúsculas.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/cotykazuf/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --- Despliegue continuo a QA (TP6) ---
  # Push a main -> los dos jobs de arriba en verde (y las imágenes publicadas) -> Render ejecuta
  # esas imágenes en QA (imgURL) -> smoke test.
  # En un Pull Request este job aparece como SKIPPED (no despliega nada).
  # Desde TP7 QA no es el final: sigue integracion -> e2e -> (aprobación humana) -> deploy-prod.
  deploy-qa:
    name: Desplegar en QA
    # needs: espera a que build-backend y build-frontend terminen BIEN. Si alguno falla o se
    # cancela, este job se saltea solo (no hace falta escribir success(): GitHub lo agrega).
    needs: [build-backend, build-frontend]
    # if: solo en un push a main. En un PR no se evalúa el environment ni se leen los secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # environment: es lo que habilita leer los secrets del environment "qa".
    environment: qa
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # URLs públicas de QA (no son secretas).
      API_URL: https://misgastos-api-qa.onrender.com
      FRONT_URL: https://misgastos-front-qa.onrender.com
    steps:
      - name: Qué vamos a desplegar
        run: |
          echo "Desplegando en QA el commit $GITHUB_SHA"
          echo "Imagen de la API:    $IMG_API"
          echo "Imagen del frontend: $IMG_FRONT"

      # Desde TP7 los servicios de Render son "Existing Image": ya no construyen commits, ejecutan
      # una imagen del registry. El deploy hook es una URL que ya trae "?key=..." (la clave) y
      # se le agrega imgURL=<imagen>:sha-<commit>, que le dice a Render QUÉ imagen ejecutar
      # (solo puede cambiar el tag: el nombre de la imagen tiene que ser el configurado en el servicio).
      # curl --get --data-urlencode agrega "imgURL=..." a la URL ya codificado ("/" y ":" pasan a
      # %2F y %3A) y, como la URL ya tiene "?", usa "&" solo. --request POST mantiene el método POST.
      # Ya no se usa "&ref=": un servicio con imagen no construye commits y lo ignoraría.
      # El valor del hook viaja solo por variable de entorno: no se imprime ni se escribe aquí.
      - name: Disparar el deploy de la API y del frontend en QA
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          disparar() {
            nombre="$1"
            hook="$2"
            imagen="$3"
            # Borramos la respuesta anterior para no mostrar la de otro servicio por error.
            rm -f respuesta.txt
            if [ -z "$hook" ]; then
              echo "::error::Falta el secret del hook de $nombre en el environment qa"
              return 1
            fi
            if [ -z "$imagen" ]; then
              echo "::error::Falta la imagen a desplegar de $nombre"
              return 1
            fi
            echo "$nombre: pidiendo a Render que ejecute $imagen"
            codigo=$(curl --silent --show-error --max-time 30 --request POST \
              --get --data-urlencode "imgURL=${imagen}" \
              --output respuesta.txt --write-out '%{http_code}' \
              "$hook") || codigo="sin respuesta"
            echo "$nombre: Render respondió HTTP $codigo"
            if [ -f respuesta.txt ]; then cat respuesta.txt; echo; fi
            case "$codigo" in
              2??) echo "$nombre: deploy de $imagen disparado" ;;
              *)
                echo "::error::No se pudo disparar el deploy de $nombre (HTTP $codigo)"
                return 1
                ;;
            esac
          }
          disparar "API" "$HOOK_API" "$IMG_API"
          disparar "Frontend" "$HOOK_FRONT" "$IMG_FRONT"

      # Smoke test: pregunta a QA hasta que responde bien, con reintentos.
      # Un servicio gratuito de Render "duerme" y su primer pedido tarda hasta ~50 s (cold start),
      # y además el deploy tarda en terminar: por eso cada intento espera hasta 60 s
      # y se reintenta, en vez de un sleep fijo. Si no responde bien, el job falla.
      - name: Smoke test de QA (con reintentos)
        run: |
          intentos=12
          espera=15
          verificar() {
            nombre="$1"
            url="$2"
            patron="$3"
            for i in $(seq 1 "$intentos"); do
              codigo=$(curl --silent --show-error --max-time 60 \
                --output cuerpo.txt --write-out '%{http_code}' "$url") || codigo="sin respuesta"
              if [ "$codigo" = "200" ] && grep -Eq "$patron" cuerpo.txt; then
                echo "OK    $nombre (intento $i)"
                return 0
              fi
              echo "...   $nombre: intento $i/$intentos, HTTP $codigo"
              sleep "$espera"
            done
            echo "::error::$nombre no respondió como se esperaba tras $intentos intentos"
            return 1
          }
          # 1) el proceso del backend está vivo (no toca la base)
          verificar "API /health" "$API_URL/health" '"status":"ok"'
          # 2) un endpoint que SÍ consulta la base: responde 200 con una lista solo si el SELECT funcionó
          verificar "API /api/gastos (consulta la base)" "$API_URL/api/gastos" '^\['
          # 3) el frontend se sirve
          verificar "Frontend /" "$FRONT_URL/" '<div id="root">'
          # 4) el frontend llega a la API a través de nginx (BACKEND_URL en runtime)
          verificar "Frontend /api/gastos (nginx hacia la API)" "$FRONT_URL/api/gastos" '^\['

  # --- Compuertas de calidad contra QA (TP7) ---
  # La cadena completa es:
  #   build-backend + build-frontend -> deploy-qa -> integracion -> e2e -> deploy-prod
  # y deploy-prod además espera la aprobación humana del environment "production".
  # Cada "needs" es una compuerta: un job solo arranca si TODOS los jobs de su needs terminaron
  # en success. Si uno falla, se cancela o se saltea, el siguiente se saltea solo (queda gris,
  # sin ejecutar ningún paso). Por eso acá no hay continue-on-error, "|| true", exit 0 ni
  # always(): nada convierte un fallo en verde. La única condición especial está en los pasos
  # de subida de reportes (!cancelled()), que no cambian el resultado del job.
  # En un Pull Request estos dos jobs aparecen como SKIPPED, igual que deploy-qa y deploy-prod.
  integracion:
    name: Integración (API de QA)
    # needs: arranca cuando deploy-qa terminó BIEN (despliegue + smoke test).
    needs: deploy-qa
    # if: solo como consecuencia de un push a main (igual que deploy-qa y deploy-prod).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # API pública de QA (no es secreta). El spec la lee de API_BASE_URL.
      API_BASE_URL: https://misgastos-api-qa.onrender.com
    steps:
      - name: Qué vamos a probar
        run: |
          echo "Pruebas de integración (sin navegador) contra la API de QA: $API_BASE_URL"
          echo "Commit de esta corrida: $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias del frontend (npm ci)
        working-directory: frontend
        run: npm ci

      # Solo api.spec.js: el proyecto "integracion" de playwright.config.js. NO se instala ningún
      # navegador: estas pruebas son pedidos HTTP directos a la API.
      # Si una prueba falla, el comando termina con error y ESTE paso deja el job en rojo.
      - name: Ejecutar la suite de integración contra QA
        working-directory: frontend
        run: npx playwright test --project=integracion e2e/api.spec.js

      # !cancelled() SOLO acá: el reporte se publica aunque la prueba haya fallado, para poder
      # diagnosticar. Este paso no cambia el resultado: el job ya quedó rojo por el paso anterior.
      - name: Publicar el reporte de integración (artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 30
          if-no-files-found: warn

  e2e:
    name: E2E (frontend de QA)
    # needs: arranca solo si integracion terminó BIEN. Si la API ya falla en integración,
    # no tiene sentido probar la pantalla: este job se saltea y PROD también.
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Frontend público de QA (no es secreto). El spec la lee de E2E_BASE_URL.
      E2E_BASE_URL: https://misgastos-front-qa.onrender.com
    steps:
      - name: Qué vamos a probar
        run: |
          echo "Pruebas E2E (Chromium real) contra el frontend de QA: $E2E_BASE_URL"
          echo "Commit de esta corrida: $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependencias del frontend (npm ci)
        working-directory: frontend
        run: npm ci

      # Descarga Chromium y las librerías del sistema que necesita (--with-deps).
      - name: Instalar Chromium y sus dependencias
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Solo gastos.spec.js: el proyecto "e2e" de playwright.config.js.
      - name: Ejecutar los flujos E2E contra QA
        working-directory: frontend
        run: npx playwright test --project=e2e e2e/gastos.spec.js

      # !cancelled() SOLO acá (ver integracion): el reporte (con capturas y trazas de los
      # reintentos) se publica aunque una prueba haya fallado.
      - name: Publicar el reporte E2E (artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 30
          if-no-files-found: warn

  deploy-prod:
    name: Desplegar en PROD
    # needs: PROD solo se considera si e2e terminó BIEN y, por transitividad, si también
    # terminaron bien integracion, deploy-qa y los dos builds (e2e -> integracion -> deploy-qa ->
    # builds). Si cualquiera falla, se cancela o se saltea, este job se saltea solo. No se usa
    # always(), !cancelled() ni continue-on-error: nada permite correr "pese a fallos previos".
    # Recién cuando todo está en verde se llega al environment y se pide la aprobación humana.
    needs: e2e
    # if: solo en un push a main (igual que QA). En un PR este job no corre.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # environment: production es el portón humano. Como el environment tiene "Required
    # reviewers", GitHub PAUSA el job ("Waiting for review") ANTES de ejecutar ningún paso y
    # de entregar los secrets de PROD. Solo corre si una revisora lo aprueba; si lo rechaza,
    # el job falla sin ejecutar nada.
    environment: production
    # concurrency: un solo deploy a PROD por vez. cancel-in-progress: false = nunca se cancela
    # un deploy que ya está en curso para dejar pasar a otro (podría quedar PROD a medias).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    # timeout-minutes cuenta desde que el job ARRANCA (después de la aprobación), no la espera.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # URLs públicas de PROD (no son secretas).
      API_URL: https://misgastos-api-prod.onrender.com
      FRONT_URL: https://misgastos-front-prod.onrender.com
    steps:
      - name: Qué vamos a desplegar
        run: |
          echo "Desplegando en PROD el commit $GITHUB_SHA (el mismo que ya pasó por QA, integración y e2e)"
          echo "Imagen de la API:    $IMG_API"
          echo "Imagen del frontend: $IMG_FRONT"

      # Desde TP7 los servicios de Render son "Existing Image": ya no construyen commits, ejecutan
      # una imagen del registry. El deploy hook es una URL que ya trae "?key=..." (la clave) y
      # se le agrega imgURL=<imagen>:sha-<commit>, que le dice a Render QUÉ imagen ejecutar
      # (solo puede cambiar el tag: el nombre de la imagen tiene que ser el configurado en el servicio).
      # curl --get --data-urlencode agrega "imgURL=..." a la URL ya codificado ("/" y ":" pasan a
      # %2F y %3A) y, como la URL ya tiene "?", usa "&" solo. --request POST mantiene el método POST.
      # Ya no se usa "&ref=": un servicio con imagen no construye commits y lo ignoraría.
      # Los hooks de PROD viven solo en el environment production (no en QA ni en el repo).
      # El valor del hook viaja solo por variable de entorno: no se imprime ni se escribe aquí.
      - name: Disparar el deploy de la API y del frontend en PROD
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          disparar() {
            nombre="$1"
            hook="$2"
            imagen="$3"
            # Borramos la respuesta anterior para no mostrar la de otro servicio por error.
            rm -f respuesta.txt
            if [ -z "$hook" ]; then
              echo "::error::Falta el secret del hook de $nombre en el environment production"
              return 1
            fi
            if [ -z "$imagen" ]; then
              echo "::error::Falta la imagen a desplegar de $nombre"
              return 1
            fi
            echo "$nombre: pidiendo a Render que ejecute $imagen"
            codigo=$(curl --silent --show-error --max-time 30 --request POST \
              --get --data-urlencode "imgURL=${imagen}" \
              --output respuesta.txt --write-out '%{http_code}' \
              "$hook") || codigo="sin respuesta"
            echo "$nombre: Render respondió HTTP $codigo"
            if [ -f respuesta.txt ]; then cat respuesta.txt; echo; fi
            case "$codigo" in
              2??) echo "$nombre: deploy de $imagen disparado en PROD" ;;
              *)
                echo "::error::No se pudo disparar el deploy de $nombre en PROD (HTTP $codigo)"
                return 1
                ;;
            esac
          }
          disparar "API" "$HOOK_API" "$IMG_API"
          disparar "Frontend" "$HOOK_FRONT" "$IMG_FRONT"

      # Smoke test de PROD: mismas comprobaciones y mismos reintentos que en QA, contra las URLs
      # de PROD (cold start de ~50 s del plan gratuito y deploy que tarda en terminar).
      # Si no responde bien, el job falla.
      - name: Smoke test de PROD (con reintentos)
        run: |
          intentos=12
          espera=15
          verificar() {
            nombre="$1"
            url="$2"
            patron="$3"
            for i in $(seq 1 "$intentos"); do
              codigo=$(curl --silent --show-error --max-time 60 \
                --output cuerpo.txt --write-out '%{http_code}' "$url") || codigo="sin respuesta"
              if [ "$codigo" = "200" ] && grep -Eq "$patron" cuerpo.txt; then
                echo "OK    $nombre (intento $i)"
                return 0
              fi
              echo "...   $nombre: intento $i/$intentos, HTTP $codigo"
              sleep "$espera"
            done
            echo "::error::$nombre no respondió como se esperaba tras $intentos intentos"
            return 1
          }
          # 1) el proceso del backend está vivo (no toca la base)
          verificar "API /health" "$API_URL/health" '"status":"ok"'
          # 2) un endpoint que SÍ consulta la base: responde 200 con una lista solo si el SELECT funcionó
          verificar "API /api/gastos (consulta la base)" "$API_URL/api/gastos" '^\['
          # 3) el frontend se sirve
          verificar "Frontend /" "$FRONT_URL/" '<div id="root">'
          # 4) el frontend llega a la API a través de nginx (BACKEND_URL en runtime)
          verificar "Frontend /api/gastos (nginx hacia la API)" "$FRONT_URL/api/gastos" '^\['
