server {
    listen 80;

    # SPA: sirve los archivos estaticos, y si la ruta pedida no es un archivo
    # real (por ejemplo /resumen, que maneja react-router del lado del
    # cliente), devuelve index.html para que React Router la resuelva.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que empiece con /api se reenvia al backend por la red interna
    # de Docker Compose (Fase 8). El nombre "backend" es el nombre que va a
    # tener ese servicio en el docker-compose.yml.
    #
    # El nombre va en una VARIABLE, no escrito directo en el proxy_pass, para
    # que nginx lo resuelva recien cuando llega un pedido y no al arrancar.
    # Si estuviera escrito directo y el contenedor "backend" no existiera
    # todavia (como ahora, que lo probamos solo), nginx se negaria a levantar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:3000;

    location /api/ {
        proxy_pass $backend_api;
    }

    location = /health {
        proxy_pass $backend_api;
    }
}
